<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Vault / Treasury body -->
  <rect x="8" y="14" width="48" height="40" rx="4" fill="#1a56db"/>
  <!-- Vault door -->
  <circle cx="32" cy="34" r="14" fill="#0f3a9c"/>
  <circle cx="32" cy="34" r="10" fill="#e8b923"/>
  <!-- Lock wheel -->
  <circle cx="32" cy="34" r="4" fill="#0f3a9c"/>
  <rect x="30" y="24" width="4" height="6" rx="1" fill="#0f3a9c"/>
  <rect x="30" y="38" width="4" height="6" rx="1" fill="#0f3a9c"/>
  <rect x="22" y="32" width="6" height="4" rx="1" fill="#0f3a9c"/>
  <rect x="36" y="32" width="6" height="4" rx="1" fill="#0f3a9c"/>
  <!-- Handle -->
  <rect x="46" y="30" width="6" height="8" rx="2" fill="#e8b923"/>
  <!-- Base shadow -->
  <rect x="12" y="50" width="40" height="3" rx="1.5" fill="#0f3a9c" opacity="0.4"/>
  <!-- Dollar sign -->
  <text x="32" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f3a9c">$</text>
</svg>
